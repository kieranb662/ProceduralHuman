name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write        # version commits and tags
  pull-requests: write   # the "Version Packages" PR
  id-token: write        # npm trusted publishing (OIDC) and provenance; no npm token is stored

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck && npm test
      # With pending changesets this opens/updates the "Version Packages" PR.
      # Without any, it publishes versions not yet on npm (requires the trusted publisher setup in the README).
      - uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
